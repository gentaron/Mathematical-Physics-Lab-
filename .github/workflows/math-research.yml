name: Mathematical Physics Research

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      max_vertices:
        description: Maximum polygon vertex count (bounded CPU experiments)
        type: choice
        options: ['5', '6', '7']
        default: '6'

permissions:
  contents: read

concurrency:
  group: math-research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  experiment:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install free exact computation stack
        run: python -m pip install -e '.[dev]'
      - name: Run reproduction and regression tests
        run: python -m pytest -q
      - name: Run bounded research experiment
        env:
          MAX_VERTICES: ${{ inputs.max_vertices || '6' }}
        run: python -m research run --max-vertices "$MAX_VERTICES" --output research/results
      - name: Face counts beyond the paper (dimension 5-9, two independent methods)
        run: python -m research higher --max-vertices 12 --output "$RUNNER_TEMP/higher.json" > /dev/null
      - name: Network feed is in sync with the committed results
        run: |
          python -m research feed --higher "$RUNNER_TEMP/higher.json" --output "$RUNNER_TEMP/feed.json"
          python - <<'PY'
          import json, os
          a = json.load(open("docs/feed.json")); b = json.load(open(os.environ["RUNNER_TEMP"] + "/feed.json"))
          strip = lambda f: [{k: v for k, v in i.items() if k != "date"} for i in f["items"]]
          assert strip(a) == strip(b), "docs/feed.json is stale: run python -m research higher --max-vertices 12 --output docs/higher.json && python -m research feed"
          PY
      - name: Publish research journal to job summary
        run: cat research/results/run-*/journal.md >> "$GITHUB_STEP_SUMMARY"
