name: Mathematical Physics Research

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      max_vertices:
        description: Maximum polygon vertex count (bounded CPU experiments)
        type: choice
        options: ['5', '6', '7']
        default: '6'

permissions:
  contents: read

concurrency:
  group: math-research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  experiment:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install free exact computation stack
        run: python -m pip install -e '.[dev]'
      - name: Run reproduction and regression tests
        run: python -m pytest -q
      - name: Run bounded research experiment
        env:
          MAX_VERTICES: ${{ inputs.max_vertices || '6' }}
        run: python -m research run --max-vertices "$MAX_VERTICES" --output research/results
      - name: Publish research journal to job summary
        run: cat research/results/run-*/journal.md >> "$GITHUB_STEP_SUMMARY"
